<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon. Mirrors the in-app logo mark: the activity pulse on the brand
    gradient, which is the one shape users associate with the product.
    Drawn on a filled tile rather than a bare glyph so it stays legible at
    16px against both light and dark browser chrome.
  -->
  <defs>
    <linearGradient id="ph-mark" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#ph-mark)" />
  <path
    d="M6 16.5h4.2l2.6-6.8 4.3 12.2 2.7-7.2 1.7 1.8H26"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
