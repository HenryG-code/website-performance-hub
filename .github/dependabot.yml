# Dependabot watches the libraries this project depends on and opens a pull request when a newer
# version comes out. Each pull request runs the security workflow and gets a Vercel preview, so a
# broken update shows up before it reaches the live site.
#
# This file controls version updates. Security alerts and security fixes are switched on separately,
# in the repository's settings on GitHub under "Advanced Security".
version: 2
updates:
  # The npm packages in package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # Small, low-risk updates arrive together as one pull request instead of one each.
      # Major versions, which can contain breaking changes, still arrive one at a time.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The actions used in .github/workflows. They are pinned to exact commits, and Dependabot moves the
  # pins forward when a new release comes out.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
